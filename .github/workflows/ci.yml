name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 全部脚本语法检查
        run: |
          for f in anime-collection-book/skills/anime-collection-book/scripts/*.js \
                   anime-collection-book/skills/anime-collection-book/evals/*.js; do
            echo "check $f"
            node --check "$f"
          done
      - name: 校验插件清单为合法 JSON
        run: |
          node -e "for (const p of ['.claude-plugin/marketplace.json','anime-collection-book/.claude-plugin/plugin.json','anime-collection-book/.zcode-plugin/plugin.json','anime-collection-book/skills/anime-collection-book/scripts/package.json']) { JSON.parse(require('fs').readFileSync(p,'utf8')); console.log('OK', p); }"
      - name: 校验版本号 5 处一致
        run: |
          node -e '
          const fs = require("fs");
          const md = fs.readFileSync("anime-collection-book/skills/anime-collection-book/SKILL.md", "utf8");
          const v = (md.match(/^\s+version:\s*"([^"]+)"/m) || [])[1];
          const places = {
            "marketplace.json": JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json","utf8")).plugins[0].version,
            ".claude-plugin/plugin.json": JSON.parse(fs.readFileSync("anime-collection-book/.claude-plugin/plugin.json","utf8")).version,
            ".zcode-plugin/plugin.json": JSON.parse(fs.readFileSync("anime-collection-book/.zcode-plugin/plugin.json","utf8")).version,
            "scripts/package.json": JSON.parse(fs.readFileSync("anime-collection-book/skills/anime-collection-book/scripts/package.json","utf8")).version,
          };
          let bad = 0;
          console.log("SKILL.md frontmatter =", v);
          for (const [k, x] of Object.entries(places)) { const ok = x === v; if (!ok) bad++; console.log((ok ? "OK  " : "BAD ") + k + " = " + x); }
          if (!v || bad) { console.error("版本号不一致：请同步 SKILL.md frontmatter + marketplace.json + 两个 plugin.json + scripts/package.json"); process.exit(1); }
          '
